# Agent config overrides for running CooperBench inside an Enroot container
# on HPC clusters (e.g. LRZ) where only rootful Podman is available.
#
# Usage:
#   export MSWEA_DOCKER_EXECUTABLE=podman
#   export DOCKER_HOST=unix:///run/podman/podman.sock
#   cooperbench run ... -a llama_cpp --agent-config /path/to/enroot_hpc.yaml
#
# Why these flags:
#   --network host   : Enroot blocks setns/CLONE_NEWNET for any non-host network
#                      namespace; bridge/custom networks fail with "netavark:
#                      setns: Operation not permitted". Host networking is the
#                      only mode that works.
#   --mount type=bind,source=/dev/pts,target=/dev/pts
#                    : crun cannot create a fresh devpts inside the Enroot
#                      container ("mount devpts: Invalid argument"); bind-mount
#                      the host's existing /dev/pts instead.
environment:
  run_args:
    - "--rm"
    - "--network"
    - "host"
    - "--mount"
    - "type=bind,source=/dev/pts,target=/dev/pts"
